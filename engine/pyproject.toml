[project]
name = "ttsengine"
version = "0.1.0"
description = "Kokoro TTS engine for TTS Studio: pronunciation and prosody controls, CPU inference."
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "kokoro>=0.9.4",
    "torch>=2.5",
    "soundfile>=0.13",
    "numpy",
    "en-core-web-sm",
]

# TTS Studio runs the worker from this folder (PYTHONPATH), so the project is never installed.
[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
